name: 🔍 Integration Smoke Test

on:
  workflow_dispatch: # Manual trigger
  push:
    branches: [ main ] # Runs automatically when you push to main

jobs:
  connectivity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Fixed the path
        with:
          python-version: '3.12'
          cache: 'pip' # Speeds up future runs significantly

      - name: Install Smoke Test Dependencies
        run: |
          pip install psycopg2-binary pandas python-dotenv requests

      - name: Run Connectivity Test
        env:
          HOT_DB_URL: ${{ secrets.HOT_DB_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python tests/connectivity_check.py
