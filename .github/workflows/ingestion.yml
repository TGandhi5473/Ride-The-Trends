name: Ride The Trends Ingestion

on:
  schedule:
    # Runs at the start of every hour (UTC)
    - cron: '0 * * * *'
  workflow_dispatch: 
    # Manual trigger for testing

# 🛡️ Least Privilege Security: Only allow reading repository contents
permissions:
  contents: read

jobs:
  ingest_and_process:
    runs-on: ubuntu-latest
    # 🕒 Set a timeout to prevent runaway costs if a scraper hangs
    timeout-minutes: 15
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # ⚡ BERT Model Caching: Prevents re-downloading BERT weights every hour
      - name: Cache BERT Weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-bert-${{ hashFiles('**/requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion Worker
        # 🛡️ SECURITY: Scoping secrets to only the step that needs them
        env:
          HOT_DB_URL: ${{ secrets.HOT_DB_URL }}
          COLD_DB_URL: ${{ secrets.COLD_DB_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          # Moved to ENV for better flexibility
          EMBEDDING_MODEL_NAME: "all-MiniLM-L6-v2"
          # 🚩 Critical for HuggingFace/BERT in CI environments
          HF_HUB_DISABLE_PROGRESS_BARS: 1
        run: python -m data_ingestion.worker

      # 📈 Health Check: Notify if the ingestion fails
      - name: Notify on Failure
        if: failure()
        run: echo "Ingestion failed! Check the Audit Hub in Streamlit for details."
