name: Ride The Trends Ingestion

on:
  schedule:
    - cron: '0 * * * *' # Hourly
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  ingest_and_process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 🔥 Advanced BERT Caching: Kept from your original logic
      - name: Cache BERT Weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-bert-v1-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-bert-v1-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion Worker
        env:
          # Aligned with core/config.py variable names
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          # Keeping your NLP settings
          EMBEDDING_MODEL_NAME: "all-MiniLM-L6-v2"
          HF_HUB_DISABLE_PROGRESS_BARS: 1
          PYTHONDONTWRITEBYTECODE: 1 
          PYTHONPATH: .
        # Running the unified worker we just wrote
        run: python worker.py

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Ingestion failed! Check the logs for QuotaExceeded errors."
