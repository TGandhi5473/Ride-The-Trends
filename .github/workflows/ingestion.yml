name: Ride The Trends Ingestion

on:
  schedule:
    - cron: '0 * * * *' # Hourly
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  ingest_and_process:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Increased slightly to account for potential retraining
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 🔥 BERT Caching: This is critical for the retraining step too!
      - name: Cache BERT Weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-bert-v1-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-bert-v1-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          EMBEDDING_MODEL_NAME: "all-MiniLM-L6-v2"
          HF_HUB_DISABLE_PROGRESS_BARS: 1
          PYTHONDONTWRITEBYTECODE: 1 
          PYTHONPATH: .
        run: python worker.py

      - name: Check for Retraining Need
        if: success() # Only retrain if the data ingestion was successful
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: .
        run: python scripts/retrain_bert.py

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Pipeline failed! Check logs for Database connectivity or BERT memory issues."
