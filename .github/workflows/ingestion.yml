name: Ride The Trends Ingestion

on:
  schedule:
    - cron: '0 * * * *' # Hourly
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  ingest_and_process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 🔥 Advanced BERT Caching: Keys off the model name AND the requirements
      - name: Cache BERT Weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-bert-v1-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-bert-v1-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion Worker
        env:
          HOT_DB_URL: ${{ secrets.HOT_DB_URL }}
          COLD_DB_URL: ${{ secrets.COLD_DB_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          EMBEDDING_MODEL_NAME: "all-MiniLM-L6-v2"
          HF_HUB_DISABLE_PROGRESS_BARS: 1
          # Prevents Python from writing .pyc files in the runner
          PYTHONDONTWRITEBYTECODE: 1 
        run: python -m data_ingestion.worker

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Ingestion failed! Logs are available in the Actions tab."
